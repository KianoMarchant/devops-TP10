name: Helm CD Multi-Environment Pipeline
on:
  push:
    branches:
      - main
      - develop

env:
  CHART_PATH: ./devops-portfolio

jobs:
  # ── FASE 1: VALIDACIÓN Y RENDER PREVIO ────────
  render-validation:
    name: Lint & Render First Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      - name: Instalar herramientas de validación
        run: pip install PyYAML yamllint
      - name: Ejecutar Helm Lint
        run: helm lint ${{ env.CHART_PATH }}
      - name: Renderizar Staging (helm template)
        run: |
          helm template test-staging ${{ env.CHART_PATH }} \
            -f ${{ env.CHART_PATH }}/values-staging.yaml > rendered-staging.yaml
      - name: Renderizar Producción (helm template)
        run: |
          helm template test-prod ${{ env.CHART_PATH }} \
            -f ${{ env.CHART_PATH }}/values-prod.yaml > rendered-prod.yaml
      - name: Auditar Sintaxis YAML Pura
        run: |
          python3 -c "
          import yaml
          for f in ['rendered-staging.yaml', 'rendered-prod.yaml']:
              with open(f) as stream:
                  docs = list(yaml.safe_load_all(stream))
                  print(f'[PASS] {f}: {len(docs)} objetos válidos de K8s.')
          "

  # ── FASE 2: DESPLIEGUE EN STAGING (CON CLÚSTER EFÍMERO) ───────────────
  deploy-staging:
    name: Deploy to Staging (Helm)
    runs-on: ubuntu-latest
    needs: render-validation
    environment:
      name: staging
      url: http://staging.devops-portfolio.local
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      
      - name: Instalar Kind y levantar clúster efímero
        uses: helm/kind-action@v1.9.0

      - name: Verificar o crear Namespace Staging
        run: |
          kubectl get namespace staging || kubectl create namespace staging

      - name: Actualizar/Instalar Release en Staging
        run: |
          helm upgrade --install notes-staging ${{ env.CHART_PATH }} \
            --namespace staging \
            -f ${{ env.CHART_PATH }}/values-staging.yaml \
            --set backend.image.repository=nginx \
            --set backend.image.tag=alpine \
            --set frontend.image.repository=nginx \
            --set frontend.image.tag=alpine \
            --wait --timeout 3m

      - name: Smoke Test en Staging
        run: |
          kubectl get pods -n staging

  # ── FASE 3: DESPLIEGUE EN PRODUCCIÓN (CON CLÚSTER EFÍMERO) ──
  deploy-production:
    name: Deploy to Production (Helm)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://devops-portfolio.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Instalar Kind y levantar clúster efímero de Prod
        uses: helm/kind-action@v1.9.0

      - name: Verificar o crear Namespace Production
        run: |
          kubectl get namespace production || kubectl create namespace production

      - name: Desplegar Release en Producción
        id: helm_deploy
        run: |
          echo "Desplegando en Producción..."
          helm upgrade --install notes-prod ${{ env.CHART_PATH }} \
            --namespace production \
            -f ${{ env.CHART_PATH }}/values-prod.yaml \
            --set backend.image.repository=nginx \
            --set backend.image.tag=alpine \
            --set frontend.image.repository=nginx \
            --set frontend.image.tag=alpine \
            --wait --timeout 3m

      - name: Smoke Test Post-Despliegue en Producción
        run: |
          kubectl get pods -n production

      - name: Resumen del Historial de Producción
        if: always()
        run: |
          helm history notes-prod --namespace production || true
